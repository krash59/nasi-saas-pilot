# Deploy gates.
# Staging: Vercel's GitHub app builds `main` (the only branch it builds) into the staging project. This job runs in the
# protected `staging` environment after CI passes on main: it waits for Vercel's deployment of exactly this commit to
# succeed, then checks health on the staging address. A failed check fails the gate (rollback: ops/RUNBOOK_ROLLBACK.md).
# Production: manual only, held for the owner's approval in the protected `production` environment, and then refused,
# because the pilot is synthetic-only (decisions/DELIVERY_DECISIONS_V1.json: production unauthorized, no real customers).
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: staging or production
        required: true
        default: staging
        type: choice
        options: [staging, production]
permissions:
  contents: read
  deployments: read
concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false
jobs:
  staging:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'staging' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://${{ vars.STAGING_HOST }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: wait for Vercel's deployment of this commit
        run: |
          for i in $(seq 1 90); do
            id=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA" --jq '[.[] | select(.creator.login=="vercel[bot]")][0].id // empty')
            if [ -n "$id" ]; then
              state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state // "pending"')
              echo "vercel deployment $id: $state"
              [ "$state" = success ] && exit 0
              case "$state" in failure|error) echo "VERCEL_DEPLOYMENT_FAILED"; exit 1;; esac
            fi
            sleep 10
          done
          echo "VERCEL_DEPLOYMENT_NOT_READY"; exit 1
      - name: post-deploy health on the staging address
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.STAGING_HOST }}/api/health" || true)
            [ "$code" = 200 ] && { echo "health 200"; exit 0; }; sleep 2
          done
          echo "STAGING_UNHEALTHY (last status $code)"; exit 1

  production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production          # held here until the owner approves (required reviewer)
    steps:
      - name: production release authority
        run: |
          echo "PRODUCTION_DENIED: the NASI pilot is synthetic-only; production is not authorized"
          echo "(decisions/DELIVERY_DECISIONS_V1.json; a production release needs its own customer and platform authorization)."
          exit 1
